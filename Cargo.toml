# makepad/apps: Makepad's open apps, as members of the enclosing Makepad workspace.
#
# `fab/` is Fab: the 3D modeler and slicer (design, mechanics, slicing and printing) and its
# electronics suite (schematic, board, routing, simulation, firmware and the bench). The app is
# `makepad-fab` (fab/app). `engine/` and `libs/` hold the shared crates Fab and other apps use:
# the HDRI and atmosphere engine, the asset data model, the model scripts, the app shell, the
# explorer's motion kit and the studio registry.
#
# This repository has no workspace of its own. It is cloned into a Makepad checkout at
# `apps/<dir>`, and its crates join Makepad's workspace, so Makepad's crates compile once for them
# and for every other app, into Makepad's `target/`, with its profiles and patches. Makepad's root
# lists `apps/*/src/..`, every app directory with a `src/`, so this package is a member when the
# repository is there; its dependencies below make the crates it names members too, because a
# path dependency inside the workspace is a member. `cfg(any())` never holds: they are never
# built, linked or feature-resolved through this package. A new crate is added here.
#
# The crates' path dependencies resolve into the surrounding Makepad checkout (`../../` from here).
[package]
name = "makepad-apps-members"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[target.'cfg(any())'.dependencies]
makepad-asset-data    = { path = "engine/asset/data" }
makepad-hdri-engine   = { path = "engine/hdri" }
makepad-model-script  = { path = "engine/model_script" }
fab-ai                = { path = "fab/ai" }
makepad-fab           = { path = "fab/app" }
