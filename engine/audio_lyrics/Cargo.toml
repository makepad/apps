[package]
name = "makepad-audio-lyrics"
version = "0.1.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Word-aligned lyrics: the karaoke alignment core and the lyrics JSON schema shared by the decks and Stage's music bake"
license = "MIT"

[dependencies]
makepad-ai-speech = { path = "../../../../libs/ai/models/speech", default-features = false, features = ["whisper"] }
makepad-asset-client = { path = "../../../apps/engine/asset/client" }
makepad-asset-data = { path = "../../../apps/engine/asset/data" }

[dev-dependencies]
# Decodes a song for the bake example.
makepad-audio-decode = { path = "../../../../libs/audio_decode" }
