[package]
name = "makepad-hdri-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The procedural HDRI generator: skies, studio rigs, casters, paint, skyline and floor layers as the engine's EnvMap"

[dependencies]
makepad-draw = { path = "../../../../draw", version = "2.0.0" }
# The environment-map plumbing (env_map: direction helpers, the key light, the
# IBL preparation) and the sky and sun maths are makepad free's.
makepad-render = { path = "../../../../libs/render" }
makepad-render-material = { path = "../../../../libs/render_material" }
makepad-scene = { path = "../../../../libs/scene" }
# EXR read/write (image.rs, export.rs) and half floats for the half-precision
# EXR option. makepad-half is a workspace.exclude crate (a vendored `half`),
# which a path dependency may still use.
makepad-openexr = { path = "../../../../libs/openexr" }
makepad-half = { path = "../../../../libs/vulkan/makepad-half" }
# The shape core flattens splines and SVG paths (shape.rs); libs/tween is
# workspace-excluded and builds as a path dependency.
makepad-tween = { path = "../../../../libs/tween" }
# Pattern lights (pattern.rs) parse their SVG with makepad free's parser.
makepad-svg = { path = "../../../../libs/svg", version = "1.0.0" }
