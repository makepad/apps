[package]
name = "makepad-csg-brep-model"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Builder operations over the exact B-rep kernel: bodies from sketches, booleans, fillets, shells, exact queries, adaptive tessellation, a guarded worker"

[dependencies]
makepad-csg-brep = { path = "../upstream/kernel" }
makepad-csg-boolean = { path = "../../../../../libs/csg/csg_boolean" }
makepad-csg-cad = { path = "../../../../../libs/csg/csg_cad" }
makepad-csg-graph = { path = "../../../../../libs/csg/csg_graph" }
makepad-csg-math = { path = "../../../../../libs/csg/csg_math" }
makepad-csg-mesh = { path = "../../../../../libs/csg/csg_mesh" }
# The worker runs under the process's one CPU budget, at its callers' classes.
makepad-cpu-budget = { path = "../../../../../libs/cpu_budget" }
# Steps report on the caller's job (the status bar's "fillets 3/7").
makepad-jobs = { path = "../../../../../libs/jobs" }
