[workspace]
manifest = "solidcore/Cargo.toml"
root_files = ["solidcore/Cargo.toml", "solidcore/LICENSE", "solidcore/NOTICE", "solidcore/ATTRIBUTION.md"]
shim_root = "sync/shims"
attribution_section = "sync/attribution.md"

[deny]
names = ["assets", "LICENSE-BRAND"]
directories = ["crates/look", "assets/branding", "assets/icons/app"]
extensions = ["svg", "png", "ico", "icns", "ttf", "otf"]

[expect]
c1_each_path_min = 1
c2_denied = 0
s1_min = 1
s2_min = 0
s3_each_pattern_min = 1
a1_per_crate = 1

[[crate]]
upstream = "solidcore/crates/solidcore"
dest = "upstream/kernel"
package = "makepad-csg-brep"
report_sites = ["src/error/bare_scan.rs:311", "src/error/site_scan.rs:1012", "src/error.rs:3467"]
rust_roots = ["src/"]
copy = ["Cargo.toml", "src/", "build.rs"]
keep = ["src/kernel/fixes/*.md"]
sections = ["package", "test", "features", "dependencies", "dev-dependencies", "lints"]
dev_dependencies = ["serde_json"]
dependencies = ["thiserror", "serde", "spade"]

[build]
producer = "solidcore/crates/solidcore/build.rs"
consumer = "solidcore/crates/solidcore/src/kernel.rs"
output = "upstream_fixes.rs"
inputs = "src/kernel/fixes/*.md"
sha256 = "03d5f435fc971cd42b3917bfba3aa7df82d0249380c25eec014fca6699911949"

[inventory]
licenses = ["Apache-2.0", "MIT OR Apache-2.0"]
license_files = ["solidcore/LICENSE", "solidcore/NOTICE"]
serde_shim = ["rename_all", "default", "deny_unknown_fields", "tag", "content", "skip_serializing_if", "rename", "from", "into"]
i1 = [
    "serde.default", "serde.rename_all", "serde.skip_serializing_if", "serde.tag",
    "thiserror.debug", "thiserror.derive", "thiserror.error", "thiserror.extra arguments",
    "thiserror.field shorthand", "thiserror.implicit", "thiserror.inline", "thiserror.plain",
    "thiserror.positional", "thiserror.transparent",
]
i2 = ["Instant", "std::io", "thread_local!"]

[[dependency]]
name = "serde_json"
version = "1"
default_features = true
features = ["float_roundtrip"]
drop = true


[[dependency]]
name = "thiserror"
package = "makepad-solidsync-thiserror"
shim = "thiserror"
version = "2"
default_features = true
features = []

[[dependency]]
name = "serde"
package = "makepad-solidsync-serde"
shim = "serde"
version = "1"
default_features = true
features = ["derive"]

[[dependency]]
name = "spade"
package = "makepad-solidsync-spade"
shim = "spade"
version = "2.15"
default_features = false
features = ["std"]

# D1 applies when the record crate enters the copy set.
[[drop_module]]
upstream = "solidcore/crates/solidcore-record"
file = "src/lib.rs"
line = "pub mod native;"
expected = 1

