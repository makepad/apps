[package]
name = "fab-elec-board"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Fab electronics board model and ops (contracts C2, C3) with the per-board engines (C4): connectivity, the rule matrix, DRC and zone fill, each with its delta-driven update form"

[package.metadata.makepad.platform-gaps]
windows = {}

[dependencies]
fab-elec-core = { path = "../core" }
fab-elec-parts = { path = "../parts" }
fab-elec-circuit = { path = "../circuit" }
# The stroke font that letters board text (std only: no shaping stack).
makepad-typography = { path = "../../../../../libs/typography", default-features = false }
