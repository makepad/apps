[package]
name = "fab-elec-design"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Fab electronics design model (contract C2): units, links, the assembly, bindings, focus and the time cursor; design ops (C3); system nets, system ERC, projection and the trace queries (C4); Rust fixtures and shared parts"

[package.metadata.makepad.platform-gaps]
windows = {}

[dependencies]
fab-elec-core = { path = "../core" }
fab-elec-parts = { path = "../parts" }
fab-elec-circuit = { path = "../circuit" }
fab-elec-board = { path = "../board" }

[dev-dependencies]
fab-elec-fixtures = { path = "../fixtures" }
